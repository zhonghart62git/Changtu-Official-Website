<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 畅途未来领袖</title>
<meta name="description" content="畅途 · 未来领袖 管理后台入口。">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png">
<meta name="theme-color" content="#0F1B2A">
<link rel="stylesheet" href="../assets/site.css">
<style>
  html,body{height:100%;}
  body{
    display:grid;place-items:center;padding:24px;
    background:#F4F8FD;
  }
  .gate{
    width:100%;max-width:392px;background:#fff;border:1px solid var(--line);
    border-radius:18px;padding:30px 30px 26px;
    box-shadow:0 16px 44px rgba(11,66,127,.10);
  }
  .gate .hd{display:flex;align-items:center;gap:11px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .gate .hd img{width:74px;height:auto;}
  .gate .hd .t{font-size:12px;color:var(--muted);letter-spacing:.4px;font-weight:600;text-transform:uppercase;}
  .gate h1{font-size:17px;font-weight:700;letter-spacing:-.2px;margin-top:18px;color:var(--ink);}
  .gate p.lead{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6;}
  .gate .bar{height:2px;border-radius:99px;background:#EEF3F9;margin:20px 0 16px;overflow:hidden;}
  .gate .bar i{
    display:block;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,var(--blue),#7B3FE4);
    animation:run 1.3s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes run{0%{transform:translateX(-110%);}100%{transform:translateX(260%);}}
  @media (prefers-reduced-motion:reduce){.gate .bar i{animation:none;width:100%;}}
  .gate .status{font-size:12.5px;color:var(--ink-2);}
  .gate .go{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    margin-top:18px;width:100%;height:42px;border-radius:10px;
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
    text-decoration:none;transition:background .16s;
  }
  .gate .go:hover{background:#1B2C42;}
  .gate .note{
    font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:16px;
    padding-top:14px;border-top:1px solid var(--line);
  }
  .gate .note a{color:var(--blue);text-decoration:none;}
  .gate .note a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="gate">
    <div class="hd">
      <img src="../assets/logo.png" alt="畅途 · 未来领袖" width="74" height="35">
      <span class="t">Internal</span>
    </div>

    <h1>管理后台</h1>
    <p class="lead">正在进入。仅限已开通管理权限的账号。</p>

    <div class="bar" aria-hidden="true"><i></i></div>
    <p class="status" id="status">正在跳转…</p>

    <a class="go" id="go" href="https://cloud1-d1g7lb8uud155b7b9-1435450577.ap-shanghai.app.tcloudbase.com/admin/">
      手动进入
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <p class="note">
      权限分五级：主管理员、平台管理员、内容编辑、AI 运营、客服。账号与权限由主管理员分配。<br>
      回到 <a href="../index.html">官网首页</a>
    </p>
  </div>

<script>
  var TARGET = 'https://cloud1-d1g7lb8uud155b7b9-1435450577.ap-shanghai.app.tcloudbase.com/admin/';
  document.getElementById('go').href = TARGET;

  setTimeout(function () { location.replace(TARGET); }, 550);

  setTimeout(function () {
    var s = document.getElementById('status');
    if (s) s.textContent = '没有自动跳转？点下面的「手动进入」。';
  }, 2600);
</script>
</body>
</html>
