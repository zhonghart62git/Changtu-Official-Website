  parent:[

      {tag:'01 / 听见原意',title:'先问“你是怎么想的？”',body:'听见孩子的理由，才知道卡点在哪里。不要急着纠正立场，也不用装作所有判断都同样有依据。可以接着问：“你从哪一句看出来的？”'},
      {tag:'02 / 理解三原力',title:'不只会说，也在学习怎样想',body:'思辨是辨清依据与解释；表达是让别人理解自己的意思；学习是在反馈后继续尝试。家庭不需要复刻一间考场，一次短对话也能练习其中一个动作。'},

  <div class="enroll-layout"><section class="enroll-form-panel"><h2>${d.name} · 咨询单</h2><p class="quiet-note">不需要姓名、手机号、学校或儿童个人资料。以下内容仅保存在当前浏览器。</p><form id="enrollment-form" data-audience="${audience}"><div class="field"><label for="enroll-goal">你希望通过课程解决什么问题？</label><textarea id="enroll-goal" data-enroll="goal" rows="3" maxlength="800" required placeholder="例如：希望学会根据孩子的真实回答继续追问。">${esc(r.goal)}</textarea></div><div class="field"><label for="enroll-time">时间偏好（选填）</label><select id="enroll-time" data-enroll="time"><option value="">请选择</option>${enrollOptions.map(x=>`<option ${r.time===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="enroll-question">还想向课程老师了解什么？（选填）</label><textarea id="enroll-question" data-enroll="question" maxlength="800" rows="3" placeholder="班期、授课方式、课程费用、适用年龄等。">${esc(r.question)}</textarea></div><label class="check-line"><input id="enroll-ack" type="checkbox" required><span>我了解这只生成咨询单；正式报名需在负责人确认的渠道完成。</span></label><button type="submit" class="button" style="margin-top:20px">生成报名咨询单 ${icon('arrow',17)}</button></form><div id="enrollment-result" class="consultation-result" ${r.generated?'':'hidden'}><span class="pill">已生成 · 尚未发送</span><h3>接下来，请你自行发送给课程老师。</h3><textarea id="consultation-text" readonly aria-label="可复制的报名咨询单" rows="9">${esc(r.generated?r.text:'')}</textarea><div class="public-actions"><button class="button" data-action="copy-consultation">复制咨询单</button><button class="button light" data-action="download-consultation">下载咨询单</button></div><p class="quiet-note">如果你尚未取得课程老师联系方式，请等待负责人补充正式报名入口。</p></div></section>
  <aside class="enroll-aside"><section><span class="eyebrow">HOW TO ENROLL</span><h2>报名方式</h2><ol><li><b>了解课程：</b>确认学习对象、目标和内容。</li><li><b>发起咨询：</b>将本页咨询单复制给你已联系的畅途课程老师。</li><li><b>确认安排：</b>核对班期、地点或线上形式、费用与名额。</li><li><b>正式报名：</b>按负责人提供的正式链接或流程完成报名。</li></ol></section><section class="enrollment-status"><h3>正式报名渠道</h3>${ENROLLMENT_CONTACT.url?`<a class="button" href="${esc(ENROLLMENT_CONTACT.url)}" target="_blank" rel="noopener noreferrer">${esc(ENROLLMENT_CONTACT.label||'打开正式报名入口')}</a>`:'<p>待负责人提供官方链接或联系人。当前网站不接收正式报名、不锁定名额、不收款。</p>'}<p class="quiet-note">具体班期、价格和退费约定以正式课程说明为准。</p></section><a class="text-button" href="#/${audience}/home">等待确认时，先体验课程 ${icon('arrow',16)}</a></aside></div>
`);}
function publicActions(e){
  const section=e.target.closest('[data-section]');
  if(section){e.preventDefault();const id=section.dataset.section;if(route.page!=='welcome'){location.hash='/welcome';setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'}),80);}else document.getElementById(id)?.scrollIntoView({behavior:'smooth'});return;}
  const b=e.target.closest('[data-action]');if(!b)return;
  if(b.dataset.action==='compare-example'){const target=document.getElementById('example-revision');target.hidden=!target.hidden;b.setAttribute('aria-expanded',String(!target.hidden));}
  if(b.dataset.action==='download-consultation'){const r=enrollmentRecord(route.audience);if(r.generated)download('破界三原力_报名咨询单_尚未发送.txt','\ufeff'+r.text,'text/plain;charset=utf-8');}
  if(b.dataset.action==='copy-consultation'){const r=enrollmentRecord(route.audience);if(!r.generated)return;const fallback=()=>{const box=document.getElementById('consultation-text');box.focus();box.select();notify('请长按或使用复制快捷键复制选中的咨询单，再自行发送。');};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(r.text).then(()=>notify('咨询单已复制，尚未发送。请粘贴给你已联系的课程老师。')).catch(fallback);else fallback();}
}
function enrollmentInput(e){if(!e.target.matches('[data-enroll]')||route.page!=='enroll')return;const r=enrollmentRecord(route.audience),field=e.target.dataset.enroll;if(!['goal','time','question'].includes(field))return;r[field]=e.target.value.slice(0,800);if(field==='goal')e.target.setCustomValidity('');r.generated=false;r.text='';document.getElementById('enrollment-result').hidden=true;persist();}
function enrollmentSubmit(e){if(e.target.id!=='enrollment-form')return;e.preventDefault();const r=enrollmentRecord(route.audience);if(!r.goal.trim()){const field=document.getElementById('enroll-goal');field.setCustomValidity('请写下希望了解的问题，不能只填空格。');field.reportValidity();return;}if(!document.getElementById('enroll-ack').checked)return;r.text=enrollmentText(route.audience);r.generated=true;persist();const result=document.getElementById('enrollment-result');result.hidden=false;document.getElementById('consultation-text').value=r.text;result.scrollIntoView({behavior:'smooth',block:'start'});notify(storageOK?'咨询单已生成，仅保存在本机，尚未发送。':'咨询单已生成但本机保存不可用；请立即复制或下载，尚未发送。');}

/* 新版课前、课中、课后环节；记录仍沿用原存储键，兼容已有初作和练习。 */
function flowLessonStep(l,r){
  if(route.step==='start')return `<span class="eyebrow muted">01 / PREPARE & ASK</span><h2 style="margin-top:12px">带着自己的问题来。</h2><p class="lead">先看本课目标，再读材料，留下你的第一版想法。不必提前找到标准答案。</p>${material(l.material)}${textField('initial','我的第一版想法',l.firstPrompt,'先写下现在的想法……',4)}${textField('preQuestion','我想弄清楚的问题（选填）','可以写一个疑问、想尝试的方法，或希望得到的帮助。','我还不确定……，想在这节课弄清楚……',3)}<div class="context-note">不要求讲述真实家庭经历。练习材料是虚构的；你的文字不会上传给机构、教师或家长。</div>${stepActions(null,'learn','带着问题学方法')}`;
  if(route.step==='notes')return `<span class="eyebrow muted">03 / NOTICE & RECORD</span><h2 style="margin-top:12px">把课堂里的发现，留下来。</h2><p class="lead">不用抄完整节课。记下一个具体发现、一处疑问，或一条帮助你继续尝试的反馈。自学时，也可以记录自己的阅读发现。</p>${r.preQuestion?`<div class="material"><small>我课前提出的问题</small>${esc(r.preQuestion)}</div>`:''}${textField('classNotes','课堂关键发现（必填）','哪一个例子、方法或回应，让你有了新的理解？请写具体。','我注意到……；原来……和……并不是一回事。',5)}${textField('classQuestion','还没解决的疑问（选填）','你仍不确定什么？下一步需要查什么、问谁或再试什么？','我想继续确认……',3)}${textField('classFeedback','收到的反馈 / 自学回看（选填）','参加课堂时记录老师或同伴的原意；自学时记录你对自己初作的发现，不虚构他人评语。','听到的反馈或我的回看发现是……',3)}<button class="button subtle" data-action="save-notes">${icon('check',17)}检查并保存课堂记录</button><div id="notes-error" class="error-box" role="alert" hidden></div><p class="quiet-note">这里只保存文字，不进行录音，也不会自动发送给老师。</p>${stepActions('learn','practice','带着发现去练习')}`;
  return lessonStep(l,r);
}
function lessonPhases(r){
  const stages=[['课前预习','start',['start','learn']],['课中记录','notes',['notes','practice']],['课后复盘','quiz',['quiz','reflect']]];
  return `${r.legacyCompletedAt&&!r.completedAt?`<p class="legacy-note">旧版自学完成记录已保留（${dateLabel(r.legacyCompletedAt)}）。补充课中记录后，可完成新版流程。</p>`:''}<nav class="lesson-phases" aria-label="学习阶段">${stages.map(([name,step,steps],i)=>`<a href="#/${route.role}/lesson/${route.lesson}/${step}" class="${steps.includes(route.step)?'active':''}"><small>0${i+1}</small>${name}</a>`).join('')}</nav>`;
}
function reflectionComparison(r){
  return `<div class="reflection-compare"><section><span class="eyebrow">BEFORE / 课前初作</span><div class="written-answer">${esc(r.initial)||'尚未填写，可回到课前预习补充。'}</div></section><section><span class="eyebrow">AFTER / 本次练习</span><div class="written-answer">${esc(r.draft)||'尚未填写，可回到课堂练习补充。'}</div></section></div>${r.classQuestion?`<div class="material"><small>课中留下的疑问：现在解决了吗？</small>${esc(r.classQuestion)}</div>`:''}<p class="quiet-note">比较你实际写下的两版内容。修改不一定越多越好，请说明为什么改，或为什么保留。</p>`;
}
function saveClassNotes(){const r=record(),box=document.getElementById('notes-error');if(!r.classNotes.trim()){box.textContent='请至少记下一条课堂关键发现。自学时，可以记录阅读中的发现。';box.hidden=false;document.getElementById('field-classNotes').focus();}else{box.hidden=true;persist();notify(storageOK?'课堂记录已保存在本机，尚未发送给老师。':'课堂记录暂存于本次会话，请及时导出。');}}
</script>
  <script>'use strict';

const STEP_NAMES=['课前预习','方法学习','课中记录','课堂练习','课后自测','课后复盘'];

const TEXT_FIELDS=['initial','preQuestion','classNotes','classQuestion','classFeedback','draft','reason','transfer','plan'];
const RECORD_LABELS=[['initial','课前初作'],['preQuestion','课前问题'],['classNotes','课堂关键发现'],['classQuestion','课中疑问'],['classFeedback','收到的反馈或自学回看'],['draft','本次练习'],['reason','修改或保留的理由'],['transfer','迁移／接话任务']];
const RUBRIC_LABELS={seen:'已看见',support:'仍需支持',unseen:'未观察到'};
const ICON_PATHS={
  home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',
  book:'M3 4h6a4 4 0 0 1 3 2 4 4 0 0 1 3-2h6v15h-6a4 4 0 0 0-3 2 4 4 0 0 0-3-2H3ZM12 6v15',

  spark:'m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z',
  check:'m5 12 4 4L19 6',switch:'M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4',
  shield:'M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Zm-4 9 3 3 5-6',
  help:'M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2M12 17h.01',
  download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',
  clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',
  leaf:'M20 3C8 2 3 7 5 15c4 7 13 4 15-12ZM5 19l9-9',
  print:'M7 8V3h10v5M7 17H3V8h18v9h-4M7 14h10v7H7Z'
};
const icon=(name,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON_PATHS[name]||ICON_PATHS.spark}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brand=()=>`<a class="logo" href="#/welcome" aria-label="破界三原力，返回课程首页"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span><span class="logo-title">破界三原力</span><span class="logo-sub" style="display:block">POJIE · LEARNING SPACE</span></span></a>`;
let state={version:1,roles:{teacher:{},parent:{},student:{}},enrollment:{}};
let storageOK=true,storageNotice='',toastTimer;
let route={role:null,page:'welcome',lesson:null,step:'start'};
let catalogFilter='available',searchValue='',toolTab='思辨';
const app=document.getElementById('app');
function emptyRecord(){return {...Object.fromEntries(TEXT_FIELDS.map(x=>[x,''])),read:false,rubric:[null,null,null,null],answers:{},result:null,attempts:[],completedAt:null,legacyCompletedAt:null,updatedAt:null};}
function normalizeRecord(raw,lesson){
  const r=emptyRecord();if(!raw||typeof raw!=='object')return r;
  for(const field of TEXT_FIELDS)if(typeof raw[field]==='string')r[field]=raw[field].slice(0,4000);
  r.read=raw.read===true;
  r.rubric=r.rubric.map((_,i)=>Object.hasOwn(RUBRIC_LABELS,raw.rubric?.[i])?raw.rubric[i]:null);
  for(const q of lesson.quiz)if(Number.isInteger(raw.answers?.[q.id])&&raw.answers[q.id]>=0&&raw.answers[q.id]<q.options.length)r.answers[q.id]=raw.answers[q.id];
  if(raw.result&&lesson.quiz.every(q=>Number.isInteger(r.answers[q.id])))r.result={score:scoreQuiz(lesson,r.answers),at:validDate(raw.result.at)};
  if(Array.isArray(raw.attempts))r.attempts=raw.attempts.slice(-20).filter(a=>Number.isInteger(a.score)&&a.score>=0&&a.score<=lesson.quiz.length&&validDate(a.at)).map(a=>({score:a.score,at:a.at}));
  r.updatedAt=validDate(raw.updatedAt);r.completedAt=validDate(raw.completedAt);r.legacyCompletedAt=validDate(raw.legacyCompletedAt);
  if(r.completedAt&&!Object.hasOwn(raw,'classNotes'))r.legacyCompletedAt=r.completedAt;
  if(missingSteps(r).length)r.completedAt=null;
  return r;
}
function validDate(v){return typeof v==='string'&&v.length<40&&Number.isFinite(Date.parse(v))?v:null;}
function loadState(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.version!==1||!parsed.roles)throw new Error('format');for(const role of Object.keys(ROLE_INFO)){for(const lesson of LESSONS[role])state.roles[role][lesson.id]=normalizeRecord(parsed.roles[role]?.[lesson.id],lesson);const input=parsed.enrollment?.[role],r=enrollmentRecord(role);if(input&&typeof input==='object'){for(const field of ['goal','question'])if(typeof input[field]==='string')r[field]=input[field].slice(0,800);r.time=enrollOptions.includes(input.time)?input.time:'';r.generated=input.generated===true&&!!r.goal.trim();r.text=r.generated?enrollmentText(role):'';}}}
    const probeKey=STORAGE_KEY+'.probe';localStorage.setItem(probeKey,'1');localStorage.removeItem(probeKey);
  }catch(e){storageOK=false;storageNotice='当前浏览器不能可靠保存，或已有记录格式无法识别。本次可临时学习，请下载记录后再关闭；已有记录不会被覆盖。';}
}
function record(role=route.role,id=route.lesson){return state.roles[role][id]||(state.roles[role][id]=emptyRecord());}
function persist(){
  if(storageOK)try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){storageOK=false;storageNotice='本机保存失败，本次内容仍在当前页面。请先下载学习记录，关闭页面可能丢失本次修改。';showStorageNotice();}
  const label=document.getElementById('save-status');if(label)label.textContent=storageOK?'已保存在本机':'仅本次会话';
}
function updateRecord(field,value){const r=record();r[field]=value;r.updatedAt=new Date().toISOString();r.completedAt=null;persist();document.querySelectorAll('[data-complete-indicator]').forEach(el=>el.hidden=true);}
function scoreQuiz(lesson,answers){return lesson.quiz.reduce((n,q)=>n+(answers[q.id]===q.answer?1:0),0);}
function missingSteps(r){const m=[];if(!r.initial.trim())m.push('留下一句初作');if(!r.read)m.push('确认已阅读方法');if(!r.classNotes.trim())m.push('记下一条课堂关键发现');if(!r.draft.trim())m.push('完成本次练习');if(!r.reason.trim())m.push('说明修改或保留的理由');if(!r.transfer.trim())m.push('完成迁移／接话任务');if(!r.result)m.push('提交本课自测');if(r.rubric.some(x=>!x))m.push('完成四项自我观察');if(!r.plan.trim())m.push('写下一个下一步');return m;}
function stepFlags(r){return [!!r.initial.trim(),r.read,!!r.classNotes.trim(),!!(r.draft.trim()&&r.reason.trim()&&r.transfer.trim()),!!r.result,!!(r.rubric.every(Boolean)&&r.plan.trim())];}
function dateLabel(v){return v?new Date(v).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'尚无记录';}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},5000);}
function showStorageNotice(){const node=document.getElementById('storage-warning');node.textContent=storageNotice;node.hidden=!storageNotice;}
function navigate(role,page,lesson,step){location.hash=role?`/${role}/${page}${lesson?'/'+lesson:''}${step?'/'+step:''}`:'/welcome';}
function readRoute(){
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  if(['course','enroll'].includes(parts[0]))return {role:null,page:parts[0],audience:Object.hasOwn(ROLE_INFO,parts[1])?parts[1]:'student',lesson:null,step:'start'};
  if(!Object.hasOwn(ROLE_INFO,parts[0]))return {role:null,page:'welcome',lesson:null,step:'start'};
  const role=parts[0],page=['home','courses','tools','report','lesson','help'].includes(parts[1])?parts[1]:'home';
  if(page==='lesson'&&!LESSONS[role].some(l=>l.id===parts[2]))return {role,page:'courses',lesson:null,step:'start'};
  return {role,page,lesson:page==='lesson'?parts[2]:null,step:STEP_KEYS.includes(parts[3])?parts[3]:'start'};
}
function welcome(){return landingPage();}
function shell(body){
  const role=ROLE_INFO[route.role];const nav=[['home','学习首页','home'],['courses','我的课程','book'],['tools','方法工具箱','grid'],['report',role.report,'chart']];
  const navHTML=mobile=>nav.map(([page,label,i])=>`<button class="${mobile?'':'nav-button '}${route.page===page||(page==='courses'&&route.page==='lesson')?'active':''}" data-action="nav" data-page="${page}" ${route.page===page?'aria-current="page"':''}>${icon(i,mobile?20:19)}<span>${label}</span></button>`).join('');
  return `<div class="app-shell"><aside class="sidebar">${brand()}<div class="role-chip row"><span class="role-icon" style="width:35px;height:35px;margin:0">${icon(role.icon,20)}</span><div><strong>${role.name}空间</strong><br><small>${role.eyebrow}</small></div></div><nav class="side-nav" aria-label="主导航">${navHTML(false)}</nav><div class="side-bottom"><a class="nav-button" href="#/course/${route.role}">${icon('book',19)}课程介绍与报名</a><button class="nav-button" data-action="nav" data-page="help">${icon('help',19)}使用与隐私</button><button class="nav-button" data-action="switch-role">${icon('switch',19)}切换学习身份</button><div class="side-note">V0.2 · 课程学习体验版<br>本机记录，不采集个人资料<br>未完成课程已标注</div></div></aside><div class="app-main"><header class="topbar"><div class="breadcrumb">破界三原力 <span aria-hidden="true"> / </span><span>${role.name}空间</span></div><div class="top-actions"><span class="save-status" id="save-status">${storageOK?'进度保存在本机':'仅本次会话'}</span><button class="mobile-menu-button" data-action="switch-role">${icon('switch',15)}切换身份</button><span class="avatar" aria-hidden="true">${role.short[0]}</span></div></header><main class="content" id="main-content" tabindex="-1">${body}<p class="footer-note">破界三原力 · 思辨 × 表达 × 学习<br>知识自测与自我观察，不作能力排名或认证。</p></main></div><nav class="mobile-nav" aria-label="手机导航">${navHTML(true)}</nav></div>`;
}
function lessonCard(l,i){const r=record(route.role,l.id),flags=stepFlags(r),filled=flags.filter(Boolean).length;return `<article class="lesson-card"><div class="lesson-symbol" aria-hidden="true"><b>${String(i+1).padStart(2,'0')}</b></div><div class="lesson-card-body"><div class="row spread"><span class="pill neutral">${l.kind}</span><small class="muted">${l.minutes}</small></div><h3>${l.title}</h3><p>${l.goal}</p><div class="progress-track" aria-label="已填写 ${filled} / ${STEP_KEYS.length} 个环节"><span style="width:${filled/STEP_KEYS.length*100}%"></span></div><div class="card-foot"><small>${r.completedAt?'已完成自学 · 待线下反馈':filled?`已记录 ${filled}/${STEP_KEYS.length} 个环节`:'未开始 · 待试教内容'}</small><button class="button ${r.completedAt?'subtle':''}" data-action="open-lesson" data-id="${l.id}">${r.completedAt?'回看课程':filled?'继续学习':'开始学习'}${icon('arrow',15)}</button></div></div></article>`;}
function home(){
  const role=ROLE_INFO[route.role],lessons=LESSONS[route.role],done=lessons.filter(l=>record(route.role,l.id).completedAt).length;
  const attempted=lessons.filter(l=>record(route.role,l.id).result).length,next=lessons.find(l=>!record(route.role,l.id).completedAt)||lessons[0];
  return `<section class="hero-panel"><div><p class="eyebrow">${role.eyebrow} / 一次具体的成长</p><h1>${role.headline}</h1><p>${role.description}</p><div class="hero-meta"><button class="button" data-action="open-lesson" data-id="${next.id}">${done===lessons.length?'回顾我的学习':'开始今天的学习'}${icon('arrow',17)}</button><small>先留下初作，再看见自己的变化</small></div></div><div class="mini-map" aria-label="想清楚、讲明白、继续学"><div class="map-node">${icon('spark')}<div><strong>思辨</strong> <span>找到依据</span></div></div><div class="map-node">${icon('book')}<div><strong>表达</strong> <span>让人理解</span></div></div><div class="map-node">${icon('leaf')}<div><strong>学习</strong> <span>反馈后再试</span></div></div></section><div class="stats"><div class="stat-card"><div class="value">${lessons.length}<small>节</small></div><p>本版可体验微课</p></div><div class="stat-card"><div class="value">${done}<small>/ ${lessons.length}</small></div><p>已完成自学流程</p></div><div class="stat-card"><div class="value">${attempted}<small>节</small></div><p>已提交课后自测</p></div></div><div class="dashboard-grid"><section><div class="section-heading" style="margin-top:0"><h2>从这里开始</h2><button class="text-button" data-action="nav" data-page="courses">查看体系地图 ${icon('arrow',15)}</button></div><div class="lesson-list">${lessons.map(lessonCard).join('')}</div><div class="context-note" style="margin-top:17px">${role.scope}</div></section><aside class="dashboard-aside"><section class="tip-card green"><p class="eyebrow">ONE SMALL STEP</p><h3>好的反馈，指到一句话。</h3><p>“这句话让我看见了……”<br>“这里我还不太确定……”<br>“你打算改哪一处，为什么？”</p><button class="text-button" data-action="nav" data-page="tools">打开方法工具箱 ${icon('arrow',15)}</button></section><section class="tip-card"><p class="eyebrow">学习不是一个总分</p><h3>看作品，也看过程</h3><ul><li>自测：检查本课知识点</li><li>自评：指出具体表现</li><li>复盘：确定下一次尝试</li></ul><p>${route.role==='teacher'?'班级名单、批改和学员统计尚未接入。':route.role==='parent'?'这里记录家长自己的练习，不会自动读取孩子的学习数据。':'不需要填写姓名、学校或联系方式，也不用分享私人经历。'}</p></section></aside></div>`;
}
function courses(){const role=ROLE_INFO[route.role];return `<div class="page-intro"><span class="eyebrow">COURSE MAP</span><h1>每一步，都知道为什么学。</h1><p>${role.track}。下面区分已接入的网页微课与后续规划；完成两节体验课，不等于完成整套课程。</p></div><div class="filter-bar"><div class="segmented" aria-label="课程视图"><button data-action="catalog-filter" data-filter="available" class="${catalogFilter==='available'?'active':''}" aria-pressed="${catalogFilter==='available'}">可体验课程</button><button data-action="catalog-filter" data-filter="roadmap" class="${catalogFilter==='roadmap'?'active':''}" aria-pressed="${catalogFilter==='roadmap'}">完整体系规划</button></div>${catalogFilter==='available'?`<input id="course-search" class="search-input" type="search" value="${esc(searchValue)}" aria-label="搜索可体验课程" placeholder="搜索课程名称或目标">`:''}</div><div id="catalog-results">${catalogBody()}</div>`;}
function catalogBody(){if(catalogFilter==='roadmap')return `<div class="context-note">${route.role==='teacher'?'六单元 18 个核心课时，每课时暂按 60 分钟规划。当前仅第 6 课时已有完整教师样板，网页导学不是新增的第 19 课时。':route.role==='student'?'原学生指南为 12 次 × 90 分钟的项目规划。当前两节网页任务是入门体验，并不代表这 12 次课程已全部制作完成。':'家长四主题为本轮新增设计，不是已定稿的历史课程；先体验前两个主题，后续依据试用反馈调整。'}</div><div class="roadmap">${ROADMAP[route.role].map((r,i)=>`<article class="road-card"><span class="number">${String(i+1).padStart(2,'0')} / ${r.range}</span><h3>${r.title}</h3><ul>${r.items.map(x=>`<li>${x}</li>`).join('')}</ul></article>`).join('')}</div>`;const list=LESSONS[route.role].filter(l=>(l.title+l.goal+l.kind).includes(searchValue.trim()));return list.length?`<div class="lesson-list">${list.map((l)=>lessonCard(l,LESSONS[route.role].indexOf(l))).join('')}</div>`:`<div class="empty-state">没有找到“${esc(searchValue)}”。试试“场景”“导学”或清空搜索。</div>`;}
function toolbox(){return `<div class="page-intro"><span class="eyebrow">THINK · EXPRESS · LEARN</span><h1>遇到卡点，再选择工具。</h1><p>保留完整工具库，不把背熟名称当作学习完成。先判断你要做什么，再挑一种工具试一试。</p></div><div class="segmented" aria-label="工具分类">${Object.keys(TOOLS).map(t=>`<button data-action="tool-tab" data-tool="${t}" class="${toolTab===t?'active':''}" aria-pressed="${toolTab===t}">${t}工具 · ${TOOLS[t].length}</button>`).join('')}</div><div class="tools-grid">${TOOLS[toolTab].map(([name,desc,ex],i)=>`<article class="tool-card"><span class="index">${String(i+1).padStart(2,'0')} / ${toolTab}</span><h3>${name}</h3><p>${desc}</p><p class="example">试一试：${ex}</p></article>`).join('')}</div><section class="questions-strip"><h3>五问是导航，不是固定台词。</h3><div class="question-tags">${['你是怎么想的？','为什么这么想？','还有呢？','反例呢？','所以呢？'].map(t=>`<span>${t}</span>`).join('')}</div><p class="muted" style="font-size:12px">缺材料就补材料，缺方法就做一次示范；再把尝试与判断交回学习者。</p></section><details class="example-box"><summary>表达可以带到哪些任务里？查看九类场景</summary><div class="example-body">语文叙事、语文议论、数学讲解、英语口语、科学实验、历史讲述、地理说明、道法议题、主持／公共发布。<small>这是任务类型与学科情境的混合清单，不简称“九科”；一次选择一类迁移，不要求一节课练完九类。</small></div></details>`;}
function material(text,label='虚构练习材料'){return `<div class="material"><small>${label}</small>${esc(text)}</div>`;}
function textField(field,label,hint,placeholder,rows=4){return `<div class="field"><label for="field-${field}">${label}</label><p class="hint" id="hint-${field}">${hint}</p><textarea id="field-${field}" data-field="${field}" aria-describedby="hint-${field}" maxlength="4000" rows="${rows}" placeholder="${esc(placeholder)}">${esc(record()[field])}</textarea><div class="field-foot"><span>只保存在当前浏览器；请勿写入真实儿童信息。</span><span data-count="${field}">${record()[field].length} / 4000</span></div></div>`;}
function stepActions(prev,next,nextLabel){return `<div class="lesson-actions">${prev?`<button class="text-button" data-action="step" data-step="${prev}">${icon('back',16)}上一步</button>`:'<span></span>'}${next?`<button class="button" data-action="step" data-step="${next}">${nextLabel||'继续'}${icon('arrow',16)}</button>`:''}</div>`;}
function lessonView(){const l=LESSONS[route.role].find(l=>l.id===route.lesson),r=record(),flags=stepFlags(r);return `<div class="lesson-top"><button class="text-button" data-action="nav" data-page="courses">${icon('back',16)}返回课程</button><span class="pill neutral">${l.minutes}</span></div><div class="lesson-title"><span class="eyebrow">${l.kind} / ${ROLE_INFO[route.role].short}任务</span><h1>${l.title}</h1><p>${l.origin}</p><p class="goal">本课目标：${l.goal}</p><span class="pill" style="margin-top:12px" data-complete-indicator ${r.completedAt?'':'hidden'}>已完成自学流程 · 未经线下评定</span></div>${lessonPhases(r)}<nav class="lesson-steps" aria-label="学习环节">${STEP_KEYS.map((s,i)=>`<button class="step-button ${route.step===s?'active':''}" data-action="step" data-step="${s}" ${route.step===s?'aria-current="step"':''}><span class="step-num">${flags[i]?icon('check',13):i+1}</span><span>${STEP_NAMES[i]}</span></button>`).join('')}</nav><div class="lesson-layout"><section class="lesson-paper">${flowLessonStep(l,r)}</section><aside class="lesson-aside"><section class="tip-card"><p class="eyebrow">这次，不急着找标准答案</p><h3>给自己一次完整尝试</h3><ul><li>先留下自己的第一句话</li><li>学方法，再写自己的版本</li><li>比较前后，解释一个选择</li></ul><div class="privacy-note">${icon('shield',16)}<span>没有后台上传、自动批改或能力排名。自测只检查本课知识。</span></div></section><section class="tip-card green"><h3>${route.role==='teacher'?'把尝试交还学习者':route.role==='parent'?'陪伴，不是代答':'你可以有自己的声音'}</h3><p>${route.role==='teacher'?'成人教师原课为 60 分钟，含同伴与线下教法片段。网页自学不能替代真人试讲。':route.role==='parent'?'本入口记录家长的练习。孩子的作品与成长，需要面对面了解，不能从你的自测推断。':'可以先列关键词、画画再写，或请人代读。短而完整也可以，不用用漂亮词语填满页面。'}</p>${l.source?`<a class="text-button" target="_blank" rel="noopener noreferrer" href="${l.source}">查看教师完整课件与逐字稿 ${icon('arrow',15)}</a>`:''}<button class="text-button" data-action="nav" data-page="tools">查找方法工具 ${icon('arrow',15)}</button></section></aside></div>`;}
function lessonStep(l,r){
  if(route.step==='learn')return `<span class="eyebrow muted">02 / FIND A USEFUL METHOD</span><h2 style="margin-top:12px">方法，是为了帮你下一步。</h2><p class="lead">边读边想：哪一个动作能帮到刚才的自己？</p>${l.cards.map(c=>`<article class="read-card"><p class="eyebrow">${c.tag}</p><h3>${c.title}</h3><p>${c.body}</p></article>`).join('')}<details class="example-box"><summary>我已经尝试，想看一个参考写法</summary><div class="example-body">${l.example}<small>${l.exampleNote}</small></div></details><label class="check-line"><input type="checkbox" id="read-done" ${r.read?'checked':''}><span>我已阅读本课方法，准备带着其中一个动作去练习。<br><small>阅读完成不等于掌握，接下来用作品检验。</small></span></label>${stepActions('start','notes','记下课堂发现')}`;
  if(route.step==='practice')return `<span class="eyebrow muted">04 / MAKE IT YOUR OWN</span><h2 style="margin-top:12px">这一次，用自己的话。</h2><p class="lead">留下作品、理由与一次迁移。不要把开放表达写成背范文。</p><details class="example-box"><summary>回看材料与我的初作</summary><div class="example-body">${material(l.material)}<strong>我的初作</strong><div class="written-answer">${esc(r.initial)||'尚未留下初作，可以回到第 1 步补写。'}</div></div></details>${textField('draft',l.practice.label,l.practice.prompt,'把你的想法写在这里……',5)}${textField('reason','我的选择与修改理由',l.practice.reason,'我把……改成……，因为……；或我保留……，因为……',3)}${l.practice.material?material(l.practice.material,'迁移任务 · 虚构材料'):''}${textField('transfer',l.practice.transferLabel,l.practice.transfer,'换一个情境，看看方法能不能用上……',4)}<button class="button subtle" data-action="save-practice">${icon('check',17)}检查并保存练习</button><div id="practice-error" class="error-box" role="alert" hidden></div>${stepActions('notes','quiz','开始课后自测')}`;
  if(route.step==='quiz')return quizView(l,r);
  return reflection(l,r);
}
function quizView(l,r){const submitted=!!r.result;return `<span class="eyebrow muted">05 / CHECK YOUR UNDERSTANDING</span><h2 style="margin-top:12px">理解检测，不是能力标签。</h2><p class="lead">共 ${l.quiz.length} 道单选题。提交后逐题查看解析，可以回到方法页再试一次。</p>${submitted?`<div class="quiz-result" role="status"><div class="score">${scoreQuiz(l,r.answers)}<small> / ${l.quiz.length}</small></div><div><h3>${scoreQuiz(l,r.answers)===l.quiz.length?'本次知识点已答对':'找到值得再看一眼的地方'}</h3><p>仅是本次知识题结果，不评定表达水平、智力或教学资格。</p></div></div>`:''}<form id="quiz-form">${l.quiz.map((q,i)=>`<fieldset class="quiz-question"><legend><span class="question-number">QUESTION ${String(i+1).padStart(2,'0')}</span>${q.prompt}</legend>${q.options.map((o,j)=>`<label class="answer-option ${submitted?(j===q.answer?'correct':r.answers[q.id]===j?'incorrect':''):''}"><input type="radio" name="${q.id}" value="${j}" ${r.answers[q.id]===j?'checked':''} ${submitted?'disabled':''}><span>${o}</span>${submitted&&j===q.answer?'<small>参考答案</small>':''}</label>`).join('')}${submitted?`<div class="explanation ${r.answers[q.id]===q.answer?'':'needs'}"><strong>${r.answers[q.id]===q.answer?'理解正确':'这里可以再想一步'}</strong>${q.explanation}</div>`:''}</fieldset>`).join('')}<div id="quiz-error" class="error-box" role="alert" hidden></div>${submitted?`<div class="row" style="flex-wrap:wrap"><button type="button" class="button light" data-action="retake">重新自测</button><button type="button" class="text-button" data-action="step" data-step="learn">回看方法 ${icon('arrow',16)}</button></div>`:'<button type="submit" class="button">提交自测，查看解析 '+icon('arrow',16)+'</button>'}</form>${stepActions('practice','reflect','去做复盘')}`;}
function reflection(l,r){return `<span class="eyebrow muted">06 / NOTICE YOUR NEXT STEP</span><h2 style="margin-top:12px">看见一处变化，找到下一步。</h2><p class="lead">下面由你对照自己的作品勾选，不是系统自动评分，也不是老师的评语。“未观察到”不等于不会。</p>${reflectionComparison(r)}${l.rubric.map((item,i)=>`<fieldset class="rubric-item"><legend>${i+1}. ${item.title}</legend><p>${item.evidence}</p><div class="rubric-options">${Object.entries(RUBRIC_LABELS).map(([value,label])=>`<label><input type="radio" name="rubric-${i}" data-rubric="${i}" value="${value}" ${r.rubric[i]===value?'checked':''}>${label}</label>`).join('')}</div><div class="support-hint" id="support-${i}">${r.rubric[i]&&r.rubric[i]!=='seen'?'可以这样再试：'+item.support:''}</div></fieldset>`).join('')}${textField('plan','我的下一个小行动','写一个具体任务，以及准备观察的一个动作。不要求承诺每天打卡。','下一次，我准备在……时试着……，看看能否……',3)}${r.completedAt?`<div class="finish-panel" data-complete-indicator><h3>这次自学，已经留下完整记录。</h3><p>完成时间：${dateLabel(r.completedAt)}。这表示流程已完成，不表示作品已获教师评定或课程已被验证。</p><button class="text-button" data-action="nav" data-page="report">查看与下载学习记录 ${icon('arrow',16)}</button></div>`:''}<div id="finish-error" class="error-box" role="alert" hidden></div><div class="context-note">完成需要：初作、阅读确认、课堂关键发现、练习与理由、迁移任务、自测、四项观察和下一步。${route.role==='teacher'?'教师还需另行完成线下试讲与观察。':'可以保留卡点，不必假装全部掌握。'}</div><div class="lesson-actions"><button class="text-button" data-action="step" data-step="quiz">${icon('back',16)}回看自测</button><button class="button" data-action="finish">保存复盘，完成本次自学 ${icon('check',16)}</button></div>`;}
function report(){const role=ROLE_INFO[route.role],lessons=LESSONS[route.role],completed=lessons.filter(l=>record(route.role,l.id).completedAt).length;return `<div class="page-intro"><span class="eyebrow">MY LEARNING JOURNAL</span><h1>${role.report}</h1><p>这里记录的是这台设备、当前浏览器中${role.name}入口的学习过程。${route.role==='parent'?'这是你的陪伴练习，不是孩子的能力报告。':'只呈现实际留下的记录，不生成模拟学员数据。'}</p></div><div class="stats"><div class="stat-card"><div class="value">${completed}<small>/ ${lessons.length}</small></div><p>完成自学的体验微课</p></div><div class="stat-card"><div class="value">${lessons.filter(l=>record(route.role,l.id).draft.trim()).length}<small>份</small></div><p>已写本课作品</p></div><div class="stat-card"><div class="value">${lessons.filter(l=>record(route.role,l.id).plan.trim()).length}<small>条</small></div><p>下一步行动</p></div></div><div class="report-controls no-print"><button class="button" data-action="download-report">${icon('download',17)}下载文字记录</button><button class="button light" data-action="print-report">${icon('print',17)}打印／存为 PDF</button><button class="button light" data-action="export-json">导出当前身份数据</button></div><div class="report-grid">${lessons.map(l=>reportCard(l)).join('')}</div><div class="context-note report-note">这些观察由学习者自填，并未经过教师审核。系统只判定知识题答案，不评价开放作品质量；需要教师或同伴线下反馈。跨设备同步、班级管理、亲子绑定和在线批改尚未接入。</div>`;}
function reportCard(l){const r=record(route.role,l.id);return `<article class="report-card"><span class="pill ${r.completedAt?'':'neutral'}">${r.completedAt?'已完成自学':'尚未完成自学'}</span><h3>${l.title}</h3><p class="quiz-stat">${r.result?`本次知识检测：${scoreQuiz(l,r.answers)} / ${l.quiz.length} 题正确 · ${r.attempts.length} 次已记录提交`:'还没有提交本课知识自测'}</p><small class="muted">最近记录：${dateLabel(r.updatedAt)}</small><div class="report-rubric">${l.rubric.map((x,i)=>`<div class="rubric-row"><span>${x.title}</span><span class="rubric-value">${RUBRIC_LABELS[r.rubric[i]]||'待观察'}</span></div>`).join('')}</div>${r.plan?`<span class="written-label">我给自己的下一步</span><div class="written-answer">${esc(r.plan)}</div>`:''}<details><summary>展开课前、课中与修订记录</summary><div>${RECORD_LABELS.map(([f,label])=>`<span class="written-label">${label}</span><div class="written-answer">${esc(r[f])||'尚未填写'}</div>`).join('')}</div></details><div class="row spread no-print" style="margin-top:18px"><button class="button subtle" data-action="open-lesson" data-id="${l.id}">回到课程 ${icon('arrow',15)}</button><button class="text-button danger" data-action="reset-lesson" data-id="${l.id}">清除此课</button></div></article>`;}
function help(){return `<div class="page-intro"><span class="eyebrow">ABOUT THIS SPACE</span><h1>安心学习，也清楚边界。</h1><p>这是《破界三原力》三端课程与学习体验版 V0.2。学习流程可以使用，完整课程与正式运营系统仍待扩展。</p></div><div class="help-grid"><section><h2>这一版可以做什么</h2><ul><li>在首页认识课程，进入三类课程详情与报名咨询。</li><li>分别进入老师、家长、学生界面。</li><li>学习 6 节网页微课、完成 30 道知识题。</li><li>保存预习问题、初作、课堂笔记、修改理由、迁移练习与复盘。</li><li>生成报名咨询单，自行发给已联系的课程老师；不是正式报名提交。</li><li>下载文字记录、导出数据、打印为 PDF。</li></ul></section><section><h2>这一版还不是什么</h2><p>不是完整的 18 课时教师课程或 12 次学生项目；家长微课为新编。不是正式报名、收款、账号系统、班级后台、亲子绑定、在线批改或能力认证平台。内容尚待真人试教。</p><p>选择身份只切换学习内容，没有身份认证或权限隔离。同一设备的其他使用者可能看到本机记录。</p></section><section><h2>数据放在哪里</h2><p>咨询单、文字与学习记录仅写入当前浏览器的本网站存储，不上传服务端；没有第三方分析、广告或外部字体。不要填写真实姓名、学校、手机号或私人经历。</p><p>浏览器隐私模式、清除网站数据、更换设备或从在线版改为离线版，记录可能不保留或不互通。导出文件也可能包含你的练习，请自己妥善保存。</p></section><section><h2>怎样理解课后评估</h2><p>选择题给出标准答案与解析，仅检查本课知识点。开放作品不自动打分：使用“已看见／仍需支持／未观察到”四项自评，并写一个后续行动。</p><p>完成标记只表示填写完自学流程，不代表教师审核、合格证书、教学效果或智力等级。</p></section><section><h2>课程依据与适用对象</h2><p>沿用三原力、原版五问与工具库；场景表达基于已制作的教师样板。家长与五、六年级学生内容是本轮适配，不能视为所有年龄段的成品。</p><p><a href="https://w6njckuict.feishu.cn/docx/To06dXZiBo7Q5LxrquvcwvKynih" target="_blank" rel="noopener noreferrer">查看框架讨论稿</a> · <a href="https://w6njckuict.feishu.cn/docx/HxO9dydoho1FgyxFWOOchGIunEe" target="_blank" rel="noopener noreferrer">查看教师样板课</a>（飞书文档需相应权限）</p></section><section><h2>离线使用与清理</h2><p>拿到单文件 HTML 后，可在电脑下载并用浏览器打开，不需要在线站点。部分手机聊天软件只预览附件，不运行网页脚本；这不等于课程文件损坏。</p><p>此处只清除本网站三种身份的本机学习记录及咨询单，不会删除其他网站数据或你下载的文件。</p><button class="button danger" data-action="reset-all" style="margin-top:15px">清除此网站全部本机记录</button></section></div>`;}
function reportText(){const role=ROLE_INFO[route.role];return ['破界三原力 · '+role.report,'版本 '+VERSION+' | 导出时间 '+new Date().toLocaleString('zh-CN'),'仅当前浏览器记录；自评未经教师核验，不是能力测评或认证。','',...LESSONS[route.role].flatMap(l=>{const r=record(route.role,l.id);return [l.title,r.completedAt?'已完成自学流程':'尚未完成自学流程','知识检测：'+(r.result?`${scoreQuiz(l,r.answers)}/${l.quiz.length} 题正确`:'尚未提交'),...RECORD_LABELS.map(([f,label])=>label+'：\n'+(r[f]||'未填写')),'自我观察（非自动评分）：',...l.rubric.map((x,i)=>x.title+'：'+(RUBRIC_LABELS[r.rubric[i]]||'待观察')),'下一步：'+(r.plan||'未填写'),'最近记录：'+dateLabel(r.updatedAt),''];})].join('\n');}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('已发起下载，请查看浏览器下载列表。');}
function render(focus=false){
  route=readRoute();document.body.dataset.role=route.role||'';
  const names={home:'学习首页',courses:'我的课程',tools:'方法工具箱',report:'学习记录',lesson:'课程学习',help:'使用与隐私',welcome:'课程首页',course:'课程介绍',enroll:'报名咨询'};
  document.title=(route.role?ROLE_INFO[route.role].name+' · ':'')+names[route.page]+' | 破界三原力';
  if(route.page==='welcome')app.innerHTML=welcome();
  else if(route.page==='course')app.innerHTML=courseDetailPage(route.audience);
  else if(route.page==='enroll')app.innerHTML=enrollmentPage(route.audience);
  else app.innerHTML=shell(({home,courses,tools:toolbox,report,lesson:lessonView,help}[route.page])());
  showStorageNotice();if(focus){const target=document.querySelector('.lesson-paper h2')||document.querySelector('main h1')||document.getElementById('main-content');if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
  if(action==='select-role'){catalogFilter='available';searchValue='';navigate(b.dataset.role,'home');}
  else if(action==='switch-role')navigate(null);
  else if(action==='help')navigate(route.role||'teacher','help');
  else if(action==='nav')navigate(route.role,b.dataset.page);
  else if(action==='open-lesson'){const r=record(route.role,b.dataset.id),flags=stepFlags(r),next=flags.indexOf(false);navigate(route.role,'lesson',b.dataset.id,r.completedAt?'reflect':STEP_KEYS[next<0?STEP_KEYS.length-1:next]);}
  else if(action==='step')navigate(route.role,'lesson',route.lesson,b.dataset.step);
  else if(action==='catalog-filter'){catalogFilter=b.dataset.filter;render();document.querySelector(`[data-filter="${catalogFilter}"]`).focus();}
  else if(action==='tool-tab'){toolTab=b.dataset.tool;render();document.querySelector(`[data-tool="${toolTab}"]`).focus();}
  else if(action==='save-notes')saveClassNotes();
  else if(action==='save-practice'){const r=record();const missing=[['draft','本次练习'],['reason','修改或保留的理由'],['transfer','迁移／接话任务']].filter(([k])=>!r[k].trim());const box=document.getElementById('practice-error');if(missing.length){box.textContent='还需要填写：'+missing.map(x=>x[1]).join('、')+'。';box.hidden=false;document.getElementById('field-'+missing[0][0]).focus();}else{box.hidden=true;persist();notify(storageOK?'练习已保存在本机。可以开始自测。':'已保留在本次会话，请及时下载记录。');}}
  else if(action==='retake'){if(confirm('重新自测会清空当前选择与解析，并取消本课完成标记；已有作品和历次提交摘要会保留。继续吗？')){const r=record();r.answers={};r.result=null;r.completedAt=null;r.updatedAt=new Date().toISOString();persist();render(true);}}
  else if(action==='finish'){const r=record(),missing=missingSteps(r);if(missing.length){const box=document.getElementById('finish-error');box.innerHTML='还需要完成：<ul>'+missing.map(x=>'<li>'+x+'</li>').join('')+'</ul>可从上方环节按钮返回补充。';box.hidden=false;box.scrollIntoView({behavior:'smooth',block:'center'});}else{r.completedAt=new Date().toISOString();r.updatedAt=r.completedAt;persist();render(true);notify('本次自学已完成，作品仍需真人反馈。');}}
  else if(action==='download-report')download(`破界三原力_${ROLE_INFO[route.role].short}学习记录.txt`,'\ufeff'+reportText(),'text/plain;charset=utf-8');
  else if(action==='export-json')download(`破界三原力_${ROLE_INFO[route.role].short}本机记录.json`,JSON.stringify({version:VERSION,exportedAt:new Date().toISOString(),role:route.role,notice:'仅此身份的本机记录；不是教师审核结果；请妥善保存。',lessons:state.roles[route.role]},null,2),'application/json;charset=utf-8');
  else if(action==='print-report'){document.querySelectorAll('.report-card details').forEach(d=>d.open=true);window.print();}
  else if(action==='reset-lesson'){const l=LESSONS[route.role].find(l=>l.id===b.dataset.id);if(l&&confirm(`仅清除当前${ROLE_INFO[route.role].short}入口“${l.title}”的本机记录？无法撤销，建议先下载。`)){state.roles[route.role][l.id]=emptyRecord();persist();render();notify('此课本机记录已清除，其他课程与身份未改变。');}}
  else if(action==='reset-all'){if(confirm('清除此网站老师、家长、学生三个入口的全部本机学习记录及咨询单？无法撤销，建议先分别下载。其他网站及已下载文件不受影响。')){try{localStorage.removeItem(STORAGE_KEY);storageOK=true;storageNotice='';}catch{storageOK=false;storageNotice='浏览器拒绝清理存储。当前会话已清空，但历史存储可能仍存在；请在浏览器设置中清理此网站数据。';}state={version:1,roles:{teacher:{},parent:{},student:{}},enrollment:{}};render();notify(storageOK?'此网站本机记录已清除。下载副本仍保留。':'当前会话已清空，请查看存储提示。');}}
});
app.addEventListener('input',e=>{
  if(e.target.matches('[data-field]')){const field=e.target.dataset.field;if(TEXT_FIELDS.includes(field)){updateRecord(field,e.target.value.slice(0,4000));document.querySelector(`[data-count="${field}"]`).textContent=e.target.value.length+' / 4000';}}
  if(e.target.id==='course-search'){searchValue=e.target.value;document.getElementById('catalog-results').innerHTML=catalogBody();}
});
app.addEventListener('change',e=>{
  if(e.target.id==='read-done')updateRecord('read',e.target.checked);
  else if(e.target.matches('[data-rubric]')){const i=Number(e.target.dataset.rubric),l=LESSONS[route.role].find(x=>x.id===route.lesson);const r=record();r.rubric[i]=e.target.value;updateRecord('rubric',r.rubric);document.getElementById('support-'+i).textContent=e.target.value==='seen'?'':'可以这样再试：'+l.rubric[i].support;}
  else if(e.target.closest('#quiz-form')&&e.target.type==='radio'){const r=record();r.answers[e.target.name]=Number(e.target.value);r.completedAt=null;r.updatedAt=new Date().toISOString();persist();}
});
app.addEventListener('submit',e=>{
  if(e.target.id!=='quiz-form')return;e.preventDefault();const l=LESSONS[route.role].find(x=>x.id===route.lesson),r=record();if(r.result)return;
  const missing=l.quiz.filter(q=>!Number.isInteger(r.answers[q.id]));if(missing.length){const box=document.getElementById('quiz-error');box.textContent=`还有 ${missing.length} 题没有作答，请选择后再提交。`;box.hidden=false;document.querySelector(`input[name="${missing[0].id}"]`).focus();return;}
  r.result={score:scoreQuiz(l,r.answers),at:new Date().toISOString()};r.attempts.push({...r.result});r.attempts=r.attempts.slice(-20);r.completedAt=null;r.updatedAt=r.result.at;persist();render(true);
});
app.addEventListener('click',publicActions);
app.addEventListener('input',enrollmentInput);
app.addEventListener('change',enrollmentInput);
app.addEventListener('submit',enrollmentSubmit);
window.addEventListener('hashchange',()=>render(true));
document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();document.getElementById('main-content')?.focus();});
loadState();render();
</script>
</body>
</html>
